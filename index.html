<!doctype html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일기">
<meta name="theme-color" content="#f4f4f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Weekly Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Jua&family=Black+Han+Sans&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2; --paper:#ffffff; --ink:#1d1d1f; --sub:#8a8a8e; --line:#e6e6e3; --grid:#6d6d70;
  --pill:#ececea; --pill-on:#7b7b7f; --pill-on2:#3a3a3d; --hl:#f2a7a7; --warn:#d98a2b; --over:#d2483f; --ok:#5b8f6a;
  --mark-x:#c0453b;
}
:root[data-theme="dark"]{
  --bg:#18181a; --paper:#222225; --ink:#ececee; --sub:#8d8d93; --line:#333338; --grid:#5c5c62;
  --pill:#2c2c30; --pill-on:#5d5d63; --pill-on2:#8a8a92; --hl:#8a3b3b; --mark-x:#e27a70;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Inter",system-ui,sans-serif;font-size:13px}
input,textarea,button{font-family:inherit;color:inherit}
button{cursor:pointer}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-size:15px}
.seg button:hover{background:var(--pill)}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{border:0;width:30px;height:30px;border-radius:7px;background:var(--pill);color:var(--sub);font-family:Inter;font-size:12px}
.months button.on1{background:var(--pill-on);color:#fff}
.months button.on2{background:var(--pill-on2);color:#fff}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--pill);border:1px solid var(--line);position:relative}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
:root[data-theme="dark"] .toggle::after{left:22px}
.save-state{margin-left:auto;color:var(--sub);font-family:Inter;font-size:12px}

/* ── header ── */
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 28px 4px}
.head h1{font-family:Inter;font-weight:700;font-size:24px;margin:0}
.head .range{font-family:Inter;font-weight:400;font-size:34px;color:var(--sub);letter-spacing:.5px}

.wrap{display:flex;gap:14px;padding:6px 20px 30px;align-items:flex-start}
.boardScroll{flex:1;overflow-x:auto;min-width:0}
.board{display:grid;grid-template-columns:repeat(7,minmax(165px,1fr));min-width:1155px}
.dayHead{padding:8px 10px 6px;font-family:Inter;font-size:14px;display:flex;gap:8px;align-items:baseline}
.dayHead .n{position:relative}
.dayHead.today .n,.dayHead.today .w{background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 85%,transparent 85%)}
.cell{background:var(--paper);border-left:1px solid var(--grid);border-bottom:1px solid var(--grid);min-width:0}
.cell.c6{border-right:1px solid var(--grid)}
.cell.r1{border-top:1px solid var(--grid)}

/* todo */
.todo{display:flex;flex-direction:column}
.trow{display:flex;border-bottom:1px solid var(--line);min-height:25px}
.trow:last-child{border-bottom:0}
.mark{width:24px;flex:none;border:0;border-right:1px solid var(--line);background:transparent;font-family:Inter;font-size:12px;font-weight:700;padding:0;color:var(--mark-x);-webkit-text-stroke:.35px currentColor}
/* 할 일·Focus on 한 줄 칸. 아주 길면 fitLine()이 두 줄로 늘린다 */
.ln{display:block;flex:1;min-width:0;border:0;background:transparent;outline:none;resize:none;overflow:hidden;word-break:break-all}
.trow .ln{padding:0 6px;font-size:12.5px;line-height:24px;height:24px}

/* gratitude */
.grat{padding:8px 8px 6px}
.grat .lbl{font-family:Inter;font-size:10.5px;color:var(--sub);letter-spacing:.6px;margin-bottom:4px}
.grow{display:flex;align-items:center;gap:6px;border-bottom:1px dashed var(--line);height:30px}
.grow:last-child{border-bottom:0}
.grow span{font-family:Inter;font-size:11px;color:var(--sub);width:12px}
.grow input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:12.5px}

/* diary */
.diary{position:relative;padding:0}
.diary textarea{--fs:12.5px;--lh:20px;display:block;width:100%;border:0;resize:none;outline:none;overflow:hidden;
  font-size:var(--fs);line-height:var(--lh);padding:6px 8px;word-break:break-all;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px),var(--line) var(--lh));
  background-position:0 6px;background-color:transparent}
.target{position:absolute;left:0;right:0;border-top:1.5px dashed var(--over);pointer-events:none;opacity:.55}
/* 원형 시간표: 테두리를 누르면 30분 단위로 선, 나뉜 칸을 누르면 아래 칸에 글쓰기 */
.tt{padding:6px 6px 4px}
.tt svg{display:block;width:100%;max-width:190px;margin:0 auto;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.ttRim{fill:none;stroke:var(--grid);stroke-width:1}
.ttNum{fill:var(--sub);font-family:Inter;font-size:8.5px;text-anchor:middle;dominant-baseline:central}
.ttCut{stroke:var(--ink);stroke-width:1.1}
.ttSel{fill:var(--hl);opacity:.4}
.ttTxt{fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.ttGhost{stroke:var(--over);stroke-width:1.2;stroke-dasharray:3 2;opacity:0;pointer-events:none}
.ttGhost.on{opacity:.8}
.ttEd{border-top:1px dashed var(--line);margin-top:4px;padding-top:3px;min-height:26px}
.ttEd span{display:block;font-family:Inter;font-size:10px;color:var(--sub);text-align:center;line-height:20px}
.ttEd input[hidden]{display:none}
.ttEd input{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:12.5px;padding:2px 2px 3px}

/* side */
.side{width:330px;flex:none;display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:14px}
.card h3{font-family:Inter;font-weight:500;font-size:14px;text-align:center;margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-family:Inter;font-size:11px;text-align:center}
.cal .h{color:var(--sub)}
.cal button{border:0;background:transparent;padding:4px 0;border-radius:5px;font-family:Inter;font-size:11px}
.cal button.dim{color:var(--sub);opacity:.5}
.cal button.wk{background:var(--pill)}
.cal button.td{outline:1.5px solid var(--hl)}
.calTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:Inter;font-size:13px}
.calTop button{border:0;background:transparent;font-size:14px;color:var(--sub)}
.focus .frow{display:flex;align-items:center;gap:8px;min-height:28px}
.focus .frow::before{content:"";width:6px;height:6px;border:1px solid var(--sub);border-radius:50%;flex:none}
.focus .ln{border-bottom:1px solid var(--line);font-size:12.5px;padding:3px 0;line-height:20px;height:27px}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.habit input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:12px;padding:2px 0;margin-bottom:5px}
.hdays{display:flex;border:1px solid var(--grid);border-radius:3px}
.hdays button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;font-family:Inter;font-size:9.5px;color:var(--sub);height:20px;padding:0}
.hdays button:last-child{border-right:0}
.hdays button.on{background:var(--ink);color:var(--paper)}
.io{display:flex;flex-direction:column;gap:6px}
.io button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;font-size:12.5px;text-align:left}
.io button:hover{border-color:var(--grid)}
.io small{color:var(--sub);font-size:11px;line-height:1.5}
@media (max-width:900px){.wrap{flex-direction:column}.side{width:100%}}

/* ── 폰: 하루 한 장 ── */
#dayView{display:none}
@media (max-width:700px){#weekView{display:none}#dayView{display:block}}
.dv{max-width:560px;margin:0 auto;padding:0 12px calc(28px + env(safe-area-inset-bottom))}
.dvTop{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.dvTop .nav{border:0;background:var(--paper);width:42px;height:42px;border-radius:10px;font-size:20px;flex:none}
.dvDate{flex:1;text-align:center;position:relative;font-family:Inter;font-weight:700;font-size:18px;min-width:0}
.dvDate.today .d{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 90%,transparent 90%)}
.dvDate small{display:block;font-weight:400;font-size:11.5px;color:var(--sub);margin-top:1px}
.dvDate .d{position:relative;display:inline-block}
.dvDate input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0}
.toToday{border:0;background:var(--pill);border-radius:6px;padding:1px 7px;margin-right:6px;font-size:11.5px;color:var(--ink)}
.dvTop .toggle{flex:none}
.dc{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.dc h4{margin:0;padding:10px 12px 4px;font-family:Inter;font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.6px}
.dv .trow{min-height:44px}
.dv .mark{width:44px;font-size:15px}
.dv .trow .ln{font-size:16px;padding:0 10px;line-height:43px;height:43px}
.dv .grat{padding:0}
.dv .grow{height:44px;padding:0 12px;gap:10px}
.dv .grow input{font-size:16px}
.dv .tt{padding:6px 12px 10px}
.dv .tt svg{max-width:360px}
.dv .ttEd span{font-size:13px;line-height:28px}
.dv .ttEd input{font-size:16px;padding:8px 2px}
.dv .focus .frow{min-height:42px;padding:0 12px}
.dv .focus .ln{font-size:16px;line-height:22px;height:29px}
.dhab{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-top:1px solid var(--line)}
.dhab:first-of-type{border-top:0}
.dhab input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.dhab .hname{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc h4 .habEdit{float:right;border:0;background:var(--pill);border-radius:6px;padding:2px 9px;font-size:11.5px;color:var(--ink);margin-top:-2px}
.dhab button{width:34px;height:34px;flex:none;border:1.5px solid var(--grid);border-radius:9px;background:transparent;font-size:16px;color:var(--paper)}
.dhab button.on{background:var(--ink);border-color:var(--ink)}
/* ── 동기화 ── */
.syncBox{display:flex;flex-direction:column;gap:6px}
.syncBox h3{margin-bottom:4px}
.syncBox .st{font-size:12.5px;color:var(--sub);text-align:center;line-height:1.5}
.syncBox button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;font-size:12.5px}
.syncBox button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.syncBox .link{border:0;background:transparent;color:var(--sub);font-size:11.5px;text-decoration:underline;padding:2px}
.dv .syncBox{padding:12px;gap:8px}
.dv .syncBox button{font-size:15px;padding:12px}
.dv .syncBox .link{font-size:13px;padding:4px}
#pwDlg{border:0;border-radius:14px;padding:20px;width:min(360px,calc(100vw - 32px));background:var(--paper);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25)}
#pwDlg::backdrop{background:rgba(0,0,0,.35)}
#pwDlg h3{margin:0 0 8px;font-size:17px}
#pwDlg p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--sub)}
#pwDlg input{display:block;width:100%;font-size:16px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--grid);border-radius:8px;background:var(--bg)}
#pwDlg input[hidden]{display:none}
#pwDlg .err{color:var(--over);min-height:1em;margin:0 0 8px}
#pwDlg .btns{display:flex;gap:8px;justify-content:flex-end}
#pwDlg .btns button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 16px;font-size:15px}
#pwDlg .btns .primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dv .io{padding:12px;gap:8px}
.dv .io button{font-size:15px;padding:12px}

/* ── 비전보드: 일기와 따로 쓰는 자유 판. 판은 가로 800 고정 좌표, 화면 폭에 맞춰 확대·축소 ── */
#visionView{display:none}
body.vn #weekView,body.vn #dayView{display:none!important}
body.vn #visionView{display:block}
.vnOpen{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-size:14px}
.dvTop .vnGo{background:var(--ink);color:var(--paper);font-size:17px}
.vnTop{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 20px 10px;display:flex;flex-direction:column;gap:8px}
.vnRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:36px}
.vnTop h2{font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:34px;margin:0 6px;line-height:1}
.vnBtn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.vnBtn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vnBtn.del{color:var(--over)}
.vnWrap{padding:4px 20px 60px}
.vnStage{position:relative;max-width:1100px;margin:0 auto;overflow:hidden;border-radius:8px}
.vnBoard{position:absolute;left:0;top:0;width:800px;transform-origin:0 0;border-radius:8px;box-shadow:0 2px 16px rgba(0,0,0,.09);overflow:hidden}
:root[data-theme="dark"] .vnBoard{filter:brightness(.86)}
.vnBg0{background:#fbf7ef radial-gradient(#dcd0b9 1.1px,transparent 1.6px) 0 0/22px 22px}
.vnBg1{background-color:#c79f72;background-image:radial-gradient(rgba(95,58,25,.28) 1px,transparent 1.7px),radial-gradient(rgba(255,240,210,.28) 1px,transparent 1.7px);background-size:9px 11px,13px 7px;background-position:0 0,4px 3px}
.vnBg2{background-color:#fdfdfb;background-image:linear-gradient(#e2eaf1 1px,transparent 1px),linear-gradient(90deg,#e2eaf1 1px,transparent 1px);background-size:24px 24px}
.vnBg3{background:#f7e6e2 radial-gradient(#ecc9c2 1.1px,transparent 1.6px) 0 0/26px 26px}
.vnHint{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:"Gaegu",cursive;font-size:26px;line-height:1.6;color:#a39883;pointer-events:none}
.vi{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;-webkit-tap-highlight-color:transparent}
.vi.sel{outline:calc(2px * var(--inv)) dashed #e07a70;outline-offset:calc(5px * var(--inv))}
.vi.photo{background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.12)}
.vi.photo img{display:block;width:100%;object-fit:cover;background:#ece8e1;pointer-events:none}
.vi.photo .cap{font-family:"Nanum Pen Script",cursive;text-align:center;color:#3a3530;line-height:1.15;padding:.3em .2em .45em;min-height:2.1em;white-space:pre-wrap;word-break:keep-all}
.vi .tape{position:absolute;left:50%;top:0;width:38%;aspect-ratio:3.4;transform:translate(-50%,-55%) rotate(-4deg);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px);
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 12%,100% 25%,96% 40%,100% 55%,96% 70%,100% 85%,96% 100%,0 100%,4% 85%,0 70%,4% 55%,0 40%,4% 25%)}
.vi.note{padding:.85em .9em;line-height:1.4;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:#3a3530;box-shadow:0 6px 14px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.08)}
.vi .pin{position:absolute;left:50%;top:0;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-30%);background:radial-gradient(circle at 35% 30%,#ffb1a8,#c0453b 70%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.vi.txt{line-height:1.15;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;text-align:center}
.vi .ph{opacity:.45}
.vh{position:absolute;width:calc(var(--hs) * var(--inv));height:calc(var(--hs) * var(--inv));border-radius:50%;background:#fff;border:calc(2px * var(--inv)) solid #e07a70;touch-action:none;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.vh.rs{right:calc(var(--hs) * var(--inv) / -2);bottom:calc(var(--hs) * var(--inv) / -2);cursor:nwse-resize}
.vh.rot{left:50%;top:calc(var(--hs) * var(--inv) * -2);transform:translateX(-50%);cursor:grab}
.vnBoard{--hs:20px}
@media (max-width:700px){
  .vnBoard{--hs:30px}
  .vnTop{padding-left:12px;padding-right:12px;gap:6px}
  .vnTop h2{font-size:28px}
  .vnBtn{padding:7px 10px;font-size:13px}
  .vnWrap{padding:4px 12px calc(40px + env(safe-area-inset-bottom))}
}
#vnDlg{border:0;border-radius:14px;padding:20px;width:min(440px,calc(100vw - 32px));background:var(--paper);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25)}
#vnDlg::backdrop{background:rgba(0,0,0,.35)}
#vnDlg h3{margin:0 0 10px;font-size:16px}
#vnDlg textarea{display:block;width:100%;font-size:16px;line-height:1.5;padding:10px 12px;border:1px solid var(--grid);border-radius:8px;background:var(--bg);resize:vertical;outline:none}
#vnDlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#vnDlg .btns button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 16px;font-size:15px}
#vnDlg .btns .primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>
</head>
<body>

<div id="weekView">
<div class="top">
  <button class="vnOpen" title="비전보드 열기">✦ 비전보드</button>
  <div class="seg">
    <button id="btnPrev" title="지난 주">‹</button>
    <button id="btnToday" title="이번 주로">오늘</button>
    <button id="btnNext" title="다음 주">›</button>
  </div>
  <div class="months" id="months"></div>
  <button class="toggle" id="theme" title="다크 모드"></button>
  <div class="save-state"><span class="saveState">자동 저장됨</span> <span class="syncState"></span></div>
</div>

<div class="head">
  <h1>Weekly record</h1>
  <div class="range" id="range"></div>
</div>

<div class="wrap">
  <div class="boardScroll"><div class="board" id="board"></div></div>

  <aside class="side">
    <div class="card">
      <div class="calTop"><button id="calPrev">‹</button><span id="calTitle"></span><button id="calNext">›</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="card focus">
      <h3>Focus on</h3>
      <div id="focus"></div>
    </div>
    <div class="card">
      <h3>Habit Tracker</h3>
      <div class="habits" id="habits"></div>
    </div>
    <div class="card syncBox"></div>
    <div class="card io">
      <button class="exportTxt"></button>
      <button class="exportTime"></button>
      <button class="exportJson">전체 백업 저장 (.json)</button>
      <button class="importJson">백업 불러오기</button>
      <small>내용은 이 브라우저에 자동 저장돼. 브라우저 기록(사이트 데이터)을 지우면 사라지니까 가끔 백업 저장해 둬.</small>
    </div>
  </aside>
</div>
</div>

<div id="dayView"></div>
<div id="visionView"></div>

<script>
const TARGET = 600, TODO_ROWS = 10, HABITS = 6, FOCUS_ROWS = 5;
// 일기 칸 기본 글씨 크기·줄 간격, 600자를 넘기면 min까지 줄어듦 (주간판 / 폰 하루 화면)
const BOARD_FS = { fs:12.5, lh:20, min:8 }, PHONE_FS = { fs:16, lh:26, min:12 };
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const KDAYS = ['월','화','수','목','금','토','일'];
const PHONE = matchMedia('(max-width:700px)');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MARKS = ['', 'O', '△', 'X'];
// 600자 칸 높이 계산용 샘플 (띄어쓰기 비율을 실제 일기와 비슷하게)
const SAMPLE = '오늘은 아침에 일어나서 수업을 듣고 과외를 갔다. 확실히 준비하니까 시간도 잘 가고 기분도 좋다. '.repeat(20).slice(0, TARGET);

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay()+6)%7)); };

// ── storage ──
const DB_KEY = 'taehee-weekly-record';
let db;
try { db = JSON.parse(localStorage.getItem(DB_KEY)) || {}; } catch { db = {}; }
db.days ??= {}; db.weeks ??= {}; db.habitNames ??= Array(HABITS).fill('');
db.vision ??= { items:{}, bg:0, bgU:0 };
let saveTimer, savePending = false;
const setState = t => document.querySelectorAll('.saveState').forEach(e => e.textContent = t);
function writeNow(){
  clearTimeout(saveTimer); savePending = false;
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); setState('자동 저장됨'); }
  catch { setState('⚠ 저장 실패 — 백업 저장을 눌러줘'); }
  markDirty();
}
function save(){
  setState('저장 중…');
  clearTimeout(saveTimer); savePending = true;
  saveTimer = setTimeout(writeNow, 300);
}
// 쓰자마자 앱을 끄거나 다른 앱으로 넘어가도 마지막 글자가 날아가지 않게 바로 저장
const flushSave = () => { if(savePending) writeNow(); };
addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSave(); });
// day()/week()는 고칠 때만 부른다. 고친 시각(u)을 찍어 두고, 동기화 때 기기끼리 더 최근 것을 고른다
const day = k => { const r = db.days[k] ??= { todos: Array.from({length:TODO_ROWS},()=>({s:0,t:''})), grat:['','',''], diary:'', kw:'' }; r.u = Date.now(); return r; };
const week = k => { const r = db.weeks[k] ??= { focus: Array(FOCUS_ROWS).fill(''), habits: Array.from({length:HABITS},()=>Array(7).fill(false)) }; r.u = Date.now(); return r; };
const setHabitName = (i, v) => { db.habitNames[i] = v; db.habitNamesU = Date.now(); save(); };
const peek = k => db.days[k];

// ── state ──
let cur = monday(new Date());
let curDay = new Date();   // 폰 하루 화면에 띄운 날
let habEdit = false;       // 폰에서 습관 이름 편집 중인지
let calMonth = null;

function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; }

// ── board ──
function renderBoard(){
  const b = $('board'); b.innerHTML = '';
  const today = key(new Date());
  const dates = DAYS.map((_,i) => addDays(cur,i));

  dates.forEach((d,i) => {
    const h = el('div', 'dayHead' + (key(d)===today ? ' today':''));
    h.innerHTML = `<span class="n">${d.getDate()}</span><span class="w">${DAYS[i]}</span>`;
    b.append(h);
  });

  // 1. 투두
  dates.forEach((d,i) => {
    const k = key(d), c = el('div', `cell todo r1 c${i}`);
    for(let r=0;r<TODO_ROWS;r++){
      const row = el('div','trow');
      const data = peek(k)?.todos[r] ?? {s:0,t:''};
      const m = el('button', 'mark' + (data.s===3?' x':''), MARKS[data.s]);
      m.title = '클릭: O → △ → X';
      m.onclick = () => { const t = day(k).todos[r]; t.s = (t.s+1)%4; m.textContent = MARKS[t.s]; m.classList.toggle('x', t.s===3); save(); };
      const inp = el('textarea'); inp.value = data.t;
      inp.oninput = () => { day(k).todos[r].t = inp.value; save(); };
      todoInput(inp); row.append(m, inp); c.append(row);
    }
    b.append(c);
  });

  // 2. 원형 시간표
  dates.forEach((d,i) => { const c = timeCircle(key(d)); c.classList.add('cell', `c${i}`); b.append(c); });

  // 3. 일기
  dates.forEach((d,i) => b.append(diaryCell(key(d), `cell diary c${i}`, BOARD_FS, i===0 ? '오늘 일기…' : '')));

  // 4. 감사한 것 3개 (예전 키워드 줄 자리)
  dates.forEach((d,i) => {
    const k = key(d), c = el('div', `cell grat c${i}`);
    c.append(el('div','lbl','감사한 것'));
    for(let g=0;g<3;g++){
      const row = el('div','grow'); row.append(el('span',null,g+1));
      const inp = el('input'); inp.value = peek(k)?.grat[g] ?? '';
      inp.oninput = () => { day(k).grat[g] = inp.value; save(); };
      inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); c.querySelectorAll('input')[g+1]?.focus(); } };
      row.append(inp); c.append(row);
    }
    b.append(c);
  });

  calibrate();
}

// ── 원형 시간표 ── 하루를 30분 칸 48개로 나눈다. 0번 = 밤 12시(맨 위), 시계 방향
// 데이터: day.tt = { c: 선이 있는 칸 번호(오름차순), t: { 칸의 시작 선 번호: 쓴 글 } }
const SLOTS = 48, TT_R = 78;
const ttAng = s => s / SLOTS * Math.PI * 2 - Math.PI / 2;
const ttPt = (s, r) => [Math.cos(ttAng(s)) * r, Math.sin(ttAng(s)) * r];
const ttSlotName = s => { s %= SLOTS; const h = Math.floor(s/2); return `${h < 12 ? '오전' : '오후'} ${h%12 || 12}시${s%2 ? ' 30분' : ''}`; };
// 시작 선 s에서 시작하는 칸이 끝나는 선 (한 바퀴 넘어가면 SLOTS를 더함)
const ttEnd = (c, s) => { const i = c.indexOf(s); return i + 1 < c.length ? c[i+1] : c[0] + SLOTS; };
// 위치 a(칸 번호, 소수 가능)가 들어 있는 칸의 시작 선
const ttSegOf = (c, a) => { let s = c[c.length-1]; for(const x of c) if(x <= a) s = x; return s; };
const ttEsc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ttCtx = document.createElement('canvas').getContext('2d');
const ttW = (s, fs) => { ttCtx.font = `${fs}px "Gowun Dodum"`; return ttCtx.measureText(s).width; };
function ttWrap(s, fs, w){
  const out = []; let line = '';
  for(const ch of s){ if(line && ttW(line + ch, fs) > w){ out.push(line); line = ch.trim(); } else line += ch; }
  if(line) out.push(line);
  return out;
}
function ttArc(a, b, R){
  if(b - a >= SLOTS) return `M${R} 0A${R} ${R} 0 1 1 ${-R} 0A${R} ${R} 0 1 1 ${R} 0Z`;
  const [x1,y1] = ttPt(a,R), [x2,y2] = ttPt(b,R);
  return `M0 0L${x1} ${y1}A${R} ${R} 0 ${b - a > SLOTS/2 ? 1 : 0} 1 ${x2} ${y2}Z`;
}
// 칸 안에 글 넣기: 넓은 칸(6시간 이상)은 가로로 여러 줄, 좁은 칸은 반지름 방향으로 한 줄
function ttText(v, a, b, R){
  const span = b - a, mid = (a + b) / 2, BASE = 9;
  if(span >= 12){
    const full = span >= SLOTS, rc = full ? 0 : R * .5;
    const w = full ? R * 1.4 : Math.min(R * 1.2, 2 * rc * Math.sin(Math.min(span, 24) / SLOTS * Math.PI));
    let fs = BASE, lines;
    for(;; fs -= .5){ lines = ttWrap(v, fs, w); if(lines.length * fs * 1.2 <= R * .6 || fs <= 4.5) break; }
    const [cx,cy] = full ? [0,0] : ttPt(mid, rc), top = cy - (lines.length - 1) * fs * .6;
    return `<text class="ttTxt" style="font-size:${fs}px">${lines.map((l,i) => `<tspan x="${cx}" y="${top + i*fs*1.2}">${ttEsc(l)}</tspan>`).join('')}</text>`;
  }
  const L = R * .64, rm = R * .51;
  let fs = Math.min(BASE, 2 * rm * Math.sin(span / SLOTS * Math.PI) * .8), t = v;
  while(ttW(t, fs) > L && fs > 4.5) fs -= .25;
  while(ttW(t, fs) > L && t.length > 1) t = t.slice(0, -2) + '…';
  let deg = ttAng(mid) * 180 / Math.PI; const flip = deg > 90 && deg < 270;
  return `<text class="ttTxt" style="font-size:${fs}px" transform="rotate(${deg}) translate(${rm} 0)${flip ? ' rotate(180)' : ''}">${ttEsc(t)}</text>`;
}
function timeCircle(k){
  const box = el('div','tt'), R = TT_R;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','-100 -100 200 200');
  const ed = el('div','ttEd'), rng = el('span'), inp = el('input');
  inp.enterKeyHint = 'next'; ed.append(rng, inp); box.append(svg, ed);
  let sel = null;   // 글 쓰는 중인 칸의 시작 선
  const data = () => peek(k)?.tt ?? { c:[], t:{} };
  const edit = () => day(k).tt ??= { c:[], t:{} };

  function draw(){
    const { c, t } = data();
    if(sel != null && !c.includes(sel)) sel = null;
    let h = sel != null ? `<path class="ttSel" d="${ttArc(sel, ttEnd(c, sel), R)}"/>` : '';
    h += `<circle class="ttRim" r="${R}"/>`;
    for(let hr=0; hr<24; hr++){ const [x,y] = ttPt(hr*2, R + 11); h += `<text class="ttNum" x="${x}" y="${y}">${hr%12 || 12}</text>`; }
    c.forEach(s => { const [x,y] = ttPt(s, R); h += `<line class="ttCut" x1="0" y1="0" x2="${x}" y2="${y}"/>`; });
    c.forEach(s => { if(t[s]) h += ttText(t[s], s, ttEnd(c, s), R); });
    svg.innerHTML = h + '<line class="ttGhost" x1="0" y1="0"/>';
    if(sel == null){
      inp.hidden = true;
      rng.textContent = '';
    } else {
      inp.hidden = false;
      rng.textContent = `${ttSlotName(sel)} ~ ${ttSlotName(ttEnd(c, sel))}`;
      if(document.activeElement !== inp) inp.value = t[sel] ?? '';
    }
    ed.hidden = inp.hidden && !rng.textContent;
  }
  // 누른 위치 → 시계 좌표 (a: 0시부터 몇 번째 30분인지, s: 가장 가까운 선 자리)
  const loc = e => {
    const r = svg.getBoundingClientRect(), sc = 200 / r.width;
    const x = (e.clientX - r.left) * sc - 100, y = (e.clientY - r.top) * sc - 100;
    let a = (Math.atan2(y, x) + Math.PI/2) / (Math.PI*2) * SLOTS; if(a < 0) a += SLOTS;
    return { x, y, r: Math.hypot(x, y), a, s: Math.round(a) % SLOTS, sc };
  };
  // 이미 있는 선 가까이를 눌렀는지
  const hitCut = (p, c) => c.find(s => {
    const g = ttAng(s), along = p.x*Math.cos(g) + p.y*Math.sin(g), off = Math.abs(p.y*Math.cos(g) - p.x*Math.sin(g));
    return along > R*.12 && along < R*1.05 && off < Math.min((PHONE.matches ? 8 : 4) * p.sc, along * .06);   // 안쪽은 칸이 좁아서 선에 아주 가까울 때만
  });
  const onRim = p => p.r > R * .85;
  function toggleCut(s){
    const r = edit(), i = r.c.indexOf(s);
    if(i < 0){ r.c.push(s); r.c.sort((a,b) => a - b); }
    else {
      r.c.splice(i, 1);
      // 선을 지우면 그 칸에 쓴 글은 앞 칸 글 뒤에 붙인다
      if(r.c.length && r.t[s] != null){ const v = r.t[s], p = ttSegOf(r.c, s); delete r.t[s]; r.t[p] = r.t[p] ? r.t[p] + ', ' + v : v; }
    }
    save(); draw();
  }
  svg.addEventListener('click', e => {
    const p = loc(e), { c } = data(), hit = hitCut(p, c);
    if(hit != null || onRim(p)){ toggleCut(hit ?? p.s); return; }
    if(!c.length) return;
    sel = ttSegOf(c, p.a); draw(); inp.focus();
  });
  // 컴퓨터: 테두리 위에 마우스를 올리면 선이 생길 자리를 점선으로 미리 보여 줌
  svg.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse') return;
    const p = loc(e), hit = hitCut(p, data().c), g = svg.querySelector('.ttGhost');
    const on = hit != null || onRim(p);
    g.classList.toggle('on', on);
    if(on){ const [x,y] = ttPt(hit ?? p.s, R); g.setAttribute('x2', x); g.setAttribute('y2', y); }
  });
  svg.addEventListener('pointerleave', () => svg.querySelector('.ttGhost').classList.remove('on'));
  inp.oninput = () => { const r = edit(); if(inp.value) r.t[sel] = inp.value; else delete r.t[sel]; save(); draw(); };
  // 엔터: 다음 시간 칸으로 (마지막 칸이면 쓰기 끝). 한글 조합 중 엔터는 글자만 확정
  inp.onkeydown = e => {
    if(e.key !== 'Enter') return;
    e.preventDefault(); if(e.isComposing) return;
    const { c, t } = data(), i = c.indexOf(sel);
    if(i < 0 || i + 1 >= c.length){ inp.blur(); return; }
    sel = c[i+1]; inp.value = t[sel] ?? ''; draw();
  };
  inp.onblur = () => { sel = null; draw(); };
  draw();
  return box;
}

// 일기 칸 하나 (줄노트 + 600자 점선). cfg는 BOARD_FS / PHONE_FS
function diaryCell(k, cls, cfg, placeholder){
  const c = el('div', cls);
  const ta = el('textarea'); ta.value = peek(k)?.diary ?? '';
  ta.placeholder = placeholder; ta._cfg = cfg; ta._targetH = 0;
  const tl = el('div','target');
  const upd = () => fit(ta);
  ta.oninput = () => { day(k).diary = ta.value; save(); upd(); };
  ta._upd = upd;
  c.append(ta, tl);
  return c;
}

// 칸 너비 기준으로 600자가 딱 차는 높이를 계산 (화면에 보이는 칸만)
function calibrate(){
  document.querySelectorAll('.ln').forEach(fitLine);
  document.querySelectorAll('.diary textarea').forEach(ta => {
    if(!ta.offsetParent) return;
    const cs = getComputedStyle(ta), cfg = ta._cfg;
    // 칸이 이미 줄어든 상태일 수 있으니 기본 크기로 잰다
    const m = el('div'); Object.assign(m.style, {
      position:'absolute', visibility:'hidden', whiteSpace:'pre-wrap', wordBreak:'break-all',
      width: (ta.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + 'px',
      fontFamily: cs.fontFamily, fontSize: cfg.fs + 'px', lineHeight: cfg.lh + 'px'
    });
    m.textContent = SAMPLE; document.body.append(m);
    const lines = Math.ceil(m.offsetHeight / cfg.lh);
    m.remove();
    const padTop = parseFloat(cs.paddingTop);
    ta._targetH = lines * cfg.lh + padTop + parseFloat(cs.paddingBottom);
    ta.parentNode.querySelector('.target').style.top = (padTop + lines*cfg.lh) + 'px';
    ta._upd();
  });
}
// 할 일·Focus on이 칸보다 길면 글씨를 줄여서 한 줄에 다 보이게 한다 (기본 글씨의 60%까지).
// 60%로도 안 들어가면 두 줄로 늘린다 (두 줄에 들어가는 가장 큰 글씨, 그래도 넘치면 줄이 더 늘어남)
function lnReset(t){ const s = t.style; s.fontSize = s.lineHeight = s.height = s.paddingTop = s.paddingBottom = ''; }
function lnWrap(t, f){
  const s = t.style; t.wrap = 'soft';
  s.fontSize = f + 'px'; s.lineHeight = f * 1.3 + 'px'; s.paddingTop = s.paddingBottom = '4px';
  s.height = '0'; const h = t.scrollHeight; s.height = h + 'px';
  return (h - 8) / (f * 1.3);   // 줄 수
}
function fitLine(t){
  lnReset(t); t.wrap = 'off';
  if(!t.offsetParent || t.scrollWidth <= t.clientWidth) return;
  const base = parseFloat(getComputedStyle(t).fontSize), fits = f => { t.style.fontSize = f + 'px'; return t.scrollWidth <= t.clientWidth; };
  let lo = base * .6, hi = base;
  if(fits(lo)){
    while(hi - lo > .1){ const mid = (lo + hi) / 2; if(fits(mid)) lo = mid; else hi = mid; }
    t.style.fontSize = lo + 'px';
    if(document.activeElement !== t) t.scrollLeft = 0;
    return;
  }
  if(lnWrap(t, hi) <= 2.5) lo = hi;
  else while(hi - lo > .1){ const mid = (lo + hi) / 2; if(lnWrap(t, mid) <= 2.5) lo = mid; else hi = mid; }
  lnWrap(t, lo);
}
// 폰에서 쓰는 중: 글씨는 16px 그대로 두고(아이폰 확대 방지) 줄이 넘어가면 칸만 늘린다
function lnLive(t){
  lnReset(t); t.wrap = 'soft';
  if(t.scrollHeight > t.clientHeight + 1) lnWrap(t, parseFloat(getComputedStyle(t).fontSize));
}
// 할 일·Focus on 입력칸: 컴퓨터는 쓰는 동안 바로 맞추고, 폰은 다 쓰고 나갈 때 맞춘다. 엔터는 줄바꿈 대신 다음 칸으로
function todoInput(t){
  t.className = 'ln'; t.rows = 1;
  t.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    e.preventDefault(); if(e.isComposing) return;   // 한글 조합 중 엔터는 글자만 확정
    const all = [...t.closest('.todo, .focus').querySelectorAll('.ln')];
    all[all.indexOf(t) + 1]?.focus();
  });
  t.addEventListener('input', () => { PHONE.matches ? lnLive(t) : fitLine(t); });
  t.addEventListener('focus', () => { if(PHONE.matches) lnLive(t); });
  t.addEventListener('blur', () => fitLine(t));
}
// 600자 칸을 넘치면 글씨와 줄 간격을 같은 비율로 줄여서 칸 안에 넣는다
function fit(ta){
  const cfg = ta._cfg, targetH = ta._targetH;
  if(!targetH) return;
  const size = (fs, lh = fs * cfg.lh / cfg.fs) => { ta.style.setProperty('--fs', fs + 'px'); ta.style.setProperty('--lh', lh + 'px'); };
  ta.style.height = targetH + 'px';
  size(cfg.fs);
  if(ta.scrollHeight <= targetH) return;
  size(cfg.min);
  // 가장 작은 글씨로도 안 들어가면 그때만 칸을 늘린다
  if(ta.scrollHeight > targetH){ ta.style.height = ta.scrollHeight + 'px'; return; }
  // 칸에 들어가는 가장 큰 글씨를 찾는다
  let lo = cfg.min, hi = cfg.fs;
  while(hi - lo > .05){ const mid = (lo + hi) / 2; size(mid); if(ta.scrollHeight <= targetH) lo = mid; else hi = mid; }
  size(lo);
  // 아래에 빈 줄이 남지 않게 줄 간격을 살짝 늘려서 마지막 줄을 점선에 맞춘다
  const cs = getComputedStyle(ta), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const m = el('div'); Object.assign(m.style, {
    position:'absolute', visibility:'hidden', whiteSpace:'pre-wrap', wordBreak:'break-all',
    width: (ta.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + 'px',
    fontFamily: cs.fontFamily, fontSize: lo + 'px', lineHeight: '100px'
  });
  m.textContent = ta.value + '​'; document.body.append(m);
  const lines = Math.round(m.offsetHeight / 100);
  m.remove();
  // 재 본 줄 수가 실제 칸과 한 줄 어긋날 수 있어서 한 줄 더 많은 경우도 해 본다
  for(const n of [lines, lines + 1]){ if(n < 1) continue; size(lo, (targetH - pad) / n); if(ta.scrollHeight <= targetH) return; }
  size(lo);
}

// ── Dropbox 동기화 ──
// 일기는 이 기기 안에서 태희가 정한 비밀번호로 AES-GCM 암호화한 다음, Dropbox 앱 폴더의 diary.enc 하나로 올린다.
// Dropbox는 암호문만 보고, 비밀번호는 어디에도 전송되지 않는다. 비밀번호를 잊으면 복구할 수 없다.
const DBX_APP = '81x109oxzg3vo4x', DBX_FILE = '/diary.enc', SYNC_KEY = 'wr-sync', PBKDF2_ITER = 600000;
const CAN_SYNC = !!(window.crypto?.subtle) && location.protocol !== 'file:';
let sync; try { sync = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch { sync = {}; }
let cryptoKey = null, syncText = '', syncing = false, syncTimer;
const saveSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch {} };
const setSync = t => { syncText = t; document.querySelectorAll('.syncState').forEach(e => e.textContent = t); };

const b64 = u8 => { let s = ''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode(...u8.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = u8 => b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/,'');

async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:PBKDF2_ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function loadKey(){
  if(!cryptoKey && sync.key) cryptoKey = await crypto.subtle.importKey('raw', unb64(sync.key), 'AES-GCM', false, ['encrypt','decrypt']);
  return cryptoKey;
}
async function encrypt(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await loadKey(), new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v:1, salt: sync.salt, iv: b64(iv), ct: b64(new Uint8Array(ct)) });
}
async function decrypt(file, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(file.iv)}, key, unb64(file.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

// Dropbox 로그인 (PKCE). 보통은 Dropbox로 갔다가 돌아오고, 안 돌아오면 코드를 복사해 붙여 넣는다
async function connect(manual){
  const v = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const c = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))));
  const p = new URLSearchParams({ client_id: DBX_APP, response_type:'code', code_challenge:c, code_challenge_method:'S256', token_access_type:'offline' });
  if(manual){
    window.open('https://www.dropbox.com/oauth2/authorize?' + p, '_blank');
    const code = await askDialog({ title:'코드로 연결', msg:'열린 Dropbox 화면에서 "허용"을 누르면 코드가 나와. 그 코드를 복사해서 여기에 붙여 넣어 줘.', code:true });
    if(!code) return;
    await getToken({ code: code.trim(), grant_type:'authorization_code', code_verifier: v, client_id: DBX_APP });
    await unlock();
  } else {
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    localStorage.setItem('wr-pkce', JSON.stringify({ v, state }));
    p.set('redirect_uri', redirectUri()); p.set('state', state);
    location.href = 'https://www.dropbox.com/oauth2/authorize?' + p;
  }
}
async function getToken(params){
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body: new URLSearchParams(params) });
  const j = await r.json();
  if(!r.ok) throw new Error('token: ' + (j.error_description || j.error || r.status));
  sync.access = j.access_token; sync.exp = Date.now() + (j.expires_in||14400)*1000;
  if(j.refresh_token) sync.refresh = j.refresh_token;
  saveSync();
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', redirectUri());
  let pk; try { pk = JSON.parse(localStorage.getItem('wr-pkce')); } catch {}
  localStorage.removeItem('wr-pkce');
  if(!q.has('code') || !pk || q.get('state') !== pk.state) { setSync('Dropbox 연결이 취소됐어'); return; }
  try {
    await getToken({ code: q.get('code'), grant_type:'authorization_code', code_verifier: pk.v, client_id: DBX_APP, redirect_uri: redirectUri() });
    await unlock();
  } catch(e) { console.error(e); setSync('⚠ Dropbox 연결 실패'); }
}
async function token(){
  if(sync.access && sync.exp > Date.now() + 60000) return sync.access;
  if(!sync.refresh) throw new Error('not connected');
  await getToken({ grant_type:'refresh_token', refresh_token: sync.refresh, client_id: DBX_APP });
  return sync.access;
}
async function dbx(url, opts = {}){
  const r = await fetch(url, { method:'POST', ...opts, headers: { Authorization: 'Bearer ' + await token(), ...opts.headers } });
  if(r.status === 409){ const j = await r.json().catch(()=>({})); const e = new Error(j.error_summary || 'conflict'); e.dbx = j.error_summary || ''; throw e; }
  if(r.status === 401){ sync.exp = 0; saveSync(); }
  if(!r.ok) throw new Error('dropbox ' + r.status);
  return r;
}
async function remoteMeta(){
  try {
    const r = await dbx('https://api.dropboxapi.com/2/files/get_metadata', { headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path: DBX_FILE }) });
    return await r.json();
  } catch(e) { if(e.dbx?.startsWith('path/not_found')) return null; throw e; }
}
async function dbxDownload(){
  const r = await dbx('https://content.dropboxapi.com/2/files/download', { headers:{'Dropbox-API-Arg': JSON.stringify({ path: DBX_FILE })} });
  return JSON.parse(await r.text());
}
async function upload(text, rev){
  const arg = { path: DBX_FILE, mode: rev ? { '.tag':'update', update: rev } : 'add', mute: true, autorename: false };
  const r = await dbx('https://content.dropboxapi.com/2/files/upload', { headers:{'Dropbox-API-Arg': JSON.stringify(arg), 'Content-Type':'application/octet-stream'}, body: text });
  return (await r.json()).rev;
}

// 비밀번호 정하기(처음 기기) 또는 입력하기(두 번째 기기부터)
async function unlock(){
  setSync('Dropbox 확인 중…');
  const meta = await remoteMeta();
  if(meta){
    const file = await dbxDownload();
    let err = '';
    for(;;){
      const pw = await askDialog({ title:'일기 비밀번호', msg:'다른 기기에서 정한 일기 비밀번호를 입력해 줘.', err });
      if(pw === null){ setSync('비밀번호를 입력해야 동기화돼'); renderSyncBoxes(); return; }
      setSync('비밀번호 확인 중…');
      const k = await deriveKey(pw, unb64(file.salt));
      try { await decrypt(file, k); } catch { err = '비밀번호가 달라. 다시 입력해 줘.'; continue; }
      sync.salt = file.salt; sync.key = b64(new Uint8Array(await crypto.subtle.exportKey('raw', k)));
      break;
    }
  } else {
    const pw = await askDialog({ title:'일기 비밀번호 정하기', msg:'이 비밀번호로 일기를 잠가서 Dropbox에 올려. <b>잊어버리면 나도, Dropbox도 절대 되살릴 수 없어.</b> 종이에 적어서 집에 보관해 줘. (8자 이상)', confirm:true });
    if(pw === null){ setSync('비밀번호를 정해야 동기화돼'); renderSyncBoxes(); return; }
    setSync('잠금 준비 중…');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const k = await deriveKey(pw, salt);
    sync.salt = b64(salt); sync.key = b64(new Uint8Array(await crypto.subtle.exportKey('raw', k)));
  }
  cryptoKey = null; sync.rev = null; sync.dirty = true; saveSync();
  renderSyncBoxes();
  await doSync();
}

// 기록마다 고친 시각(u)이 더 최근인 쪽을 남긴다
function merge(remote){
  let changed = false, localNewer = false;
  const pick = (a, b) => (b?.u||0) > (a?.u||0);
  for(const kind of ['days','weeks']){
    const L = db[kind], R = remote[kind] || {};
    for(const k in R) if(!L[k] || pick(L[k], R[k])) { L[k] = R[k]; changed = true; }
    for(const k in L) if(!R[k] || pick(R[k], L[k])) localNewer = true;
  }
  const lu = db.habitNamesU||0, ru = remote.habitNamesU||0;
  if(remote.habitNames && ru > lu){ db.habitNames = remote.habitNames; db.habitNamesU = ru; changed = true; }
  else if(lu > ru) localNewer = true;
  // 비전보드: 붙인 것 하나하나를 따로 비교 (지운 것도 del 표시로 남겨서 다른 기기에서도 지워지게)
  const LV = db.vision, RV = remote.vision;
  if(RV){
    for(const id in RV.items) if(!LV.items[id] || pick(LV.items[id], RV.items[id])) { LV.items[id] = RV.items[id]; changed = true; }
    for(const id in LV.items) if(!RV.items[id] || pick(RV.items[id], LV.items[id])) localNewer = true;
    if((RV.bgU||0) > (LV.bgU||0)){ LV.bg = RV.bg; LV.bgU = RV.bgU; changed = true; }
    else if((LV.bgU||0) > (RV.bgU||0)) localNewer = true;
  } else if(Object.keys(LV.items).length || LV.bgU) localNewer = true;
  return { changed, localNewer };
}
function markDirty(){
  if(!sync.key) return;
  sync.dirty = true; saveSync();
  clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 3000);
}
async function doSync(retry = 0){
  if(!CAN_SYNC || !sync.refresh || !sync.key) return;
  if(syncing){ clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 2000); return; }
  if(!navigator.onLine){ setSync('오프라인 · 연결되면 맞출게'); return; }
  syncing = true; setSync('동기화 중…');
  try {
    const meta = await remoteMeta();
    let up = sync.dirty || !meta;
    if(meta && meta.rev !== sync.rev){
      const remote = await decrypt(await dbxDownload(), await loadKey());
      const { changed, localNewer } = merge(remote);
      if(changed){
        try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch {}
        const a = document.activeElement;
        if(a && /INPUT|TEXTAREA/.test(a.tagName)) a.addEventListener('blur', () => render(), { once:true });
        else render();
      }
      up = up || localNewer;
      sync.rev = meta.rev;
    }
    if(up){
      const text = await encrypt({ days: db.days, weeks: db.weeks, habitNames: db.habitNames, habitNamesU: db.habitNamesU || 0, vision: db.vision });
      sync.rev = await upload(text, meta ? meta.rev : null);
      sync.dirty = false;
    }
    await vnSyncImgs().catch(e => console.error('사진 동기화', e));
    sync.last = Date.now(); saveSync();
    const t = new Date(sync.last);
    setSync(`☁ 동기화됨 ${pad(t.getHours())}:${pad(t.getMinutes())}`);
  } catch(e) {
    console.error(e);
    syncing = false;
    if(e.dbx?.startsWith('path/conflict') && retry < 2) return doSync(retry + 1);
    if(String(e.message).includes('OperationError')) setSync('⚠ 비밀번호가 바뀌었어. 연결 끊고 다시 연결해 줘');
    else if(String(e.message).startsWith('token')) { setSync('⚠ Dropbox 다시 연결이 필요해'); }
    else setSync('⚠ 동기화 실패 · 잠시 뒤 다시 할게');
    return;
  }
  syncing = false;
}
function disconnect(){
  if(!confirm('이 기기에서 Dropbox 연결을 끊을까? 이 기기에 저장된 일기와 Dropbox에 있는 일기는 그대로 남아.')) return;
  sync = {}; cryptoKey = null; saveSync(); setSync(''); renderSyncBoxes();
}

  const btn = (txt, cls, fn) => { const b = el('button', cls, txt); b.onclick = fn; box.append(b); };

    box.append(el('div','st','동기화는 웹 주소에서만 돼<br><b>taehee-lab.github.io/diary</b>'));

// 비밀번호/코드 입력 창
function askDialog({ title, msg, confirm: twice = false, code = false, err = '' }){
  const d = $('pwDlg');
  $('pwTitle').textContent = title; $('pwMsg').innerHTML = msg; $('pwErr').textContent = err;
  const p1 = $('pw1'), p2 = $('pw2'), pc = $('pwCode');
  p1.value = p2.value = pc.value = '';
  p1.hidden = code; p2.hidden = !twice; pc.hidden = !code;
  p1.placeholder = twice ? '새 비밀번호' : '비밀번호';
  return new Promise(res => {
    $('pwOk').onclick = e => {
      if(code){ if(!pc.value.trim()){ e.preventDefault(); $('pwErr').textContent = '코드를 붙여 넣어 줘.'; } return; }
      if(twice && p1.value.length < 8){ e.preventDefault(); $('pwErr').textContent = '8자 이상으로 정해 줘.'; return; }
      if(twice && p1.value !== p2.value){ e.preventDefault(); $('pwErr').textContent = '두 번 입력한 비밀번호가 달라.'; return; }
      if(!p1.value){ e.preventDefault(); $('pwErr').textContent = '비밀번호를 입력해 줘.'; }
    };
    d.onclose = () => res(d.returnValue === 'ok' ? (code ? pc.value : p1.value) : null);
    d.returnValue = ''; d.showModal(); (code ? pc : p1).focus();
  });
}

// ── 비전보드 ──
// db.vision.items[id] = { t:'photo'|'note'|'txt', x, y, w, fs(글씨), r(기울기°), z(겹침 순서), c(색 번호), f(글꼴 번호), text, img, ar(사진 세로/가로), u }
// 지운 것은 { del:true, u }로 남긴다. 사진 파일은 localStorage가 좁아서 IndexedDB('wr-vision')에 따로 두고,
// Dropbox에는 일기와 같은 키로 암호화해서 /img/<id>.enc 로 올린다
const VN_W = 800, VN_MAX = 1600;
const VN_FONTS = ['"Nanum Pen Script",cursive', '"Gaegu",cursive', '"Jua",sans-serif', '"Black Han Sans",sans-serif', '"Gowun Dodum",sans-serif'];
const VN_NOTE = ['#fff3a8','#ffd8dd','#d6ecd3','#d4e6f7','#e5dbf5','#fdf6e9'];
const VN_INK = ['#2b2b2e','#c0453b','#3b6ea5','#4f7d5c','#b0793a','#ffffff'];
const VN_TAPE = ['rgba(240,165,165,.78)','rgba(165,203,235,.8)','rgba(245,218,135,.82)','rgba(182,218,176,.8)','rgba(208,188,235,.8)','transparent'];
const VN_BGS = 4;
let vnOpen = false, vnSelId = null, vnScale = 1, vnLastTap = { id:null, t:0 };
const vnUrls = {};
const vnItems = () => Object.entries(db.vision.items).filter(([,it]) => !it.del).sort((a,b) => a[1].z - b[1].z);
const vnEdit = id => { const r = db.vision.items[id]; r.u = Date.now(); save(); return r; };
const vnPad = w => `${w * .055}px ${w * .055}px 0`;   // 폴라로이드 흰 테두리 (사진 폭 기준)
const vnRand = (a, b) => a + Math.random() * (b - a);

// 사진 저장소 (IndexedDB)
let vnDbP;
const vnIdb = () => vnDbP ??= new Promise((res, rej) => {
  const r = indexedDB.open('wr-vision', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('img');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function vnStore(mode, fn){
  const d = await vnIdb();
  return new Promise((res, rej) => { const tx = d.transaction('img', mode), rq = fn(tx.objectStore('img')); tx.oncomplete = () => res(rq.result); tx.onerror = () => rej(tx.error); });
}
const imgGet = id => vnStore('readonly', s => s.get(id)).catch(() => null);
const imgPut = (id, b) => vnStore('readwrite', s => s.put(b, id));
const imgDel = id => vnStore('readwrite', s => s.delete(id)).catch(() => {});
async function vnImgUrl(id){
  if(vnUrls[id]) return vnUrls[id];
  const b = await imgGet(id);
  return b ? vnUrls[id] = URL.createObjectURL(b) : null;
}

function openVision(on){
  flushSave();
  vnOpen = on; vnSelId = null;
  document.body.classList.toggle('vn', on);
  if(on) vnRender(); else render();
  scrollTo(0, 0);
}

function vnRender(){
  const v = $('visionView'); v.innerHTML = '';
  const top = el('div','vnTop'), r1 = el('div','vnRow'), r2 = el('div','vnRow');
  const back = el('button','vnBtn','‹ 일기'); back.onclick = () => openVision(false);
  const st = el('div','save-state', `<span class="saveState">자동 저장됨</span> <span class="syncState">${syncText}</span>`);
  r1.append(back, el('h2', null, 'Vision Board'), st);
  r2.className = 'vnRow vnTools';
  top.append(r1, r2);

  const wrap = el('div','vnWrap'), stage = el('div','vnStage'), board = el('div','vnBoard vnBg' + (db.vision.bg || 0));
  board.addEventListener('pointerdown', e => { if(e.target === board) vnSelect(null); });
  const items = vnItems();
  if(!items.length) board.append(el('div','vnHint', PHONE.matches
    ? '＋ 사진으로 앨범 사진을 붙이고<br>＋ 메모, ＋ 글씨로 꾸며 봐'
    : '사진을 복사해서 Ctrl+V로 붙여 넣거나<br>위의 ＋ 버튼으로 채워 봐<br>되고 싶은 나, 가고 싶은 곳, 갖고 싶은 하루'));
  items.forEach(([id]) => board.append(vnItemEl(id)));
  stage.append(board); wrap.append(stage);
  // 사진 파일을 끌어다 놓아도 붙는다
  stage.addEventListener('dragover', e => e.preventDefault());
  stage.addEventListener('drop', e => { e.preventDefault(); vnAddPhotos([...e.dataTransfer.files]); });
  v.append(top, wrap);
  vnTools();
  vnLayout();
}

// 화면 폭에 맞춰 판 크기 조절 + 붙인 것 아래로 여유를 둬서 판 길이를 정한다
function vnLayout(){
  const stage = document.querySelector('.vnStage'), board = document.querySelector('.vnBoard');
  if(!stage) return;
  vnScale = stage.clientWidth / VN_W;
  let h = Math.max(1000, (innerHeight - 140) / vnScale);
  board.querySelectorAll('.vi').forEach(e => h = Math.max(h, e.offsetTop + e.offsetHeight + 260));
  board.style.height = h + 'px';
  board.style.transform = `scale(${vnScale})`;
  board.style.setProperty('--inv', 1 / vnScale);
  stage.style.height = h * vnScale + 'px';
}

// 위 도구 줄: 아무것도 안 고르면 '붙이기' 버튼들, 하나를 고르면 그걸 고치는 버튼들
function vnTools(){
  const r = document.querySelector('.vnTools'); if(!r) return;
  r.innerHTML = '';
  const b = (txt, fn, cls = '') => { const x = el('button', 'vnBtn ' + cls, txt); x.onclick = fn; r.append(x); };
  const it = vnSelId && db.vision.items[vnSelId];
  if(!it || it.del){
    b('＋ 사진', () => $('vnFile').click(), 'dark');
    b('＋ 메모', () => vnAdd('note'));
    b('＋ 글씨', () => vnAdd('txt'));
    b('배경 바꾸기', () => { db.vision.bg = ((db.vision.bg || 0) + 1) % VN_BGS; db.vision.bgU = Date.now(); save(); document.querySelector('.vnBoard').className = 'vnBoard vnBg' + db.vision.bg; });
    return;
  }
  const id = vnSelId;
  b(it.t === 'photo' ? '사진 밑 글' : '글 고치기', () => vnEditText(id));
  b(it.t === 'photo' ? '테이프 색' : '색', () => { const x = vnEdit(id); x.c = (x.c + 1) % 6; vnRepaint(id); });
  if(it.t !== 'photo') b('글꼴', () => { const x = vnEdit(id); x.f = (x.f + 1) % VN_FONTS.length; vnRepaint(id); vnLayout(); });
  b('맨 앞', () => { vnEdit(id).z = Math.max(0, ...vnItems().map(([,x]) => x.z)) + 1; vnRepaint(id); });
  b('맨 뒤', () => { vnEdit(id).z = Math.min(0, ...vnItems().map(([,x]) => x.z)) - 1; vnRepaint(id); });
  b('똑바로', () => { vnEdit(id).r = 0; vnRepaint(id); });
  b('지우기', () => vnDelete(id), 'del');
  b('완료', () => vnSelect(null), 'dark');
}

function vnSelect(id){
  if(vnSelId === id) return;
  const old = vnSelId; vnSelId = id;
  if(old && db.vision.items[old] && !db.vision.items[old].del) vnRepaint(old);
  if(id) vnRepaint(id);
  vnTools();
}
function vnRepaint(id){
  const e = document.querySelector(`.vi[data-id="${id}"]`);
  if(e) vnPaint(e, db.vision.items[id], id);
}

function vnPaint(e, it, id){
  e.className = 'vi ' + it.t + (id === vnSelId ? ' sel' : '');
  // 고른 것은 잠깐 맨 위로 보여서 손잡이를 잡을 수 있게 (저장된 겹침 순서는 그대로)
  Object.assign(e.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px', zIndex: id === vnSelId ? 100000 : it.z,transform: `rotate(${it.r}deg)`, fontSize: it.fs + 'px' });
  e.innerHTML = '';
  if(it.t === 'photo'){
    e.style.padding = vnPad(it.w);
    const im = el('img'); im.draggable = false; im.alt = ''; im.style.aspectRatio = `1 / ${it.ar || 1}`;
    vnImgUrl(it.img).then(u => { if(u) im.src = u; });
    const cap = el('div','cap'); cap.textContent = it.text || '';
    e.append(im, cap);
    if(it.c < 5){ const tape = el('div','tape'); tape.style.backgroundColor = VN_TAPE[it.c]; e.append(tape); }
  } else {
    e.style.fontFamily = VN_FONTS[it.f];
    if(it.t === 'note'){ e.style.background = VN_NOTE[it.c]; e.style.minHeight = it.w * .78 + 'px'; e.append(el('div','pin')); }
    else e.style.color = VN_INK[it.c];
    const s = el('span', it.text ? '' : 'ph'); s.textContent = it.text || (it.t === 'note' ? '두 번 눌러서 쓰기' : '두 번 눌러서 쓰기');
    e.append(s);
  }
  if(id === vnSelId){ e.append(el('div','vh rs'), el('div','vh rot')); }
}

function vnItemEl(id){
  const e = el('div'); e.dataset.id = id;
  vnPaint(e, db.vision.items[id], id);
  // 끌어서 옮기기 / 오른쪽 아래 동그라미로 크기 / 위 동그라미로 돌리기
  e.addEventListener('pointerdown', ev => {
    if(ev.button > 0) return;
    ev.preventDefault();
    vnSelect(id);
    const it = db.vision.items[id], s = vnScale, sx = ev.clientX, sy = ev.clientY;
    const h = ev.target.closest('.vh'), mode = !h ? 'mv' : h.classList.contains('rs') ? 'rs' : 'rot';
    const rc = e.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
    const d0 = Math.hypot(sx - cx, sy - cy) || 1, a0 = Math.atan2(sy - cy, sx - cx), h0 = e.offsetHeight;
    const n = { x: it.x, y: it.y, w: it.w, fs: it.fs, r: it.r };
    let moved = false;
    e.setPointerCapture(ev.pointerId);
    const move = m => {
      const dx = m.clientX - sx, dy = m.clientY - sy;
      if(!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      if(mode === 'mv'){
        n.x = Math.min(VN_W - it.w * .3, Math.max(-it.w * .7, it.x + dx / s));
        n.y = Math.max(-h0 * .5, it.y + dy / s);
      } else if(mode === 'rs'){
        const f = Math.min(760 / it.w, Math.max(50 / it.w, Math.hypot(m.clientX - cx, m.clientY - cy) / d0));
        n.w = it.w * f; n.fs = it.fs * f;
        n.x = it.x + (it.w - n.w) / 2; n.y = it.y + h0 * (1 - f) / 2;   // 가운데를 기준으로 커지고 작아짐
      } else {
        let r = it.r + (Math.atan2(m.clientY - cy, m.clientX - cx) - a0) * 180 / Math.PI;
        r = ((r + 540) % 360) - 180;
        n.r = Math.abs(r) < 3 ? 0 : r;
      }
      Object.assign(e.style, { left: n.x + 'px', top: n.y + 'px', width: n.w + 'px', fontSize: n.fs + 'px', transform: `rotate(${n.r}deg)` });
      if(it.t === 'note') e.style.minHeight = n.w * .78 + 'px';
      if(it.t === 'photo') e.style.padding = vnPad(n.w);
    };
    const up = () => {
      e.removeEventListener('pointermove', move); e.removeEventListener('pointerup', up); e.removeEventListener('pointercancel', up);
      if(moved){ Object.assign(vnEdit(id), n); vnLayout(); return; }
      // 두 번 누르면 글 쓰기
      const now = Date.now();
      if(mode === 'mv' && vnLastTap.id === id && now - vnLastTap.t < 400){ vnLastTap = { id:null, t:0 }; vnEditText(id); }
      else vnLastTap = { id, t: now };
    };
    e.addEventListener('pointermove', move); e.addEventListener('pointerup', up); e.addEventListener('pointercancel', up);
  });
  return e;
}

function vnAdd(t, o = {}){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const w = { photo: 240, note: 190, txt: 360 }[t], fs = { photo: 22, note: 20, txt: 48 }[t];
  const stage = document.querySelector('.vnStage').getBoundingClientRect();
  const midY = (Math.min(innerHeight, stage.bottom) + Math.max(0, stage.top)) / 2 - stage.top;
  const zs = vnItems().map(([,x]) => x.z);
  db.vision.items[id] = {
    t, w, fs, x: VN_W / 2 - w / 2 + vnRand(-90, 90), y: Math.max(30, midY / vnScale - w / 2 + vnRand(-50, 50)),
    r: t === 'txt' ? 0 : Math.round(vnRand(-5, 5)), z: (zs.length ? Math.max(...zs) : 0) + 1,
    c: Math.floor(Math.random() * 5), f: t === 'txt' ? 0 : 1, text: '', u: Date.now(), ...o
  };
  save();
  vnSelId = id; vnRender();
  if(t !== 'photo' && !o.text) vnEditText(id);
}
// 사진은 긴 쪽 1600px JPEG로 줄여서 저장 (브라우저 저장 공간과 동기화 시간을 아끼려고)
async function vnShrink(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.src = url;
  try { await img.decode(); } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
  const k = Math.min(1, VN_MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  return { blob, ar: c.height / c.width };
}
async function vnAddPhotos(files){
  files = files.filter(f => f.type.startsWith('image/'));
  for(const f of files){
    try {
      const { blob, ar } = await vnShrink(f);
      const img = Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
      await imgPut(img, blob);
      vnAdd('photo', { img, ar });
    } catch(e) { console.error(e); alert('이 사진은 붙이지 못했어.'); }
  }
}
function vnDelete(id){
  const it = db.vision.items[id];
  if(!confirm(it.t === 'photo' ? '이 사진을 비전보드에서 지울까?' : '이걸 지울까?')) return;
  if(it.img){ imgDel(it.img); if(vnUrls[it.img]) URL.revokeObjectURL(vnUrls[it.img]); delete vnUrls[it.img]; }
  db.vision.items[id] = { del: true, u: Date.now() };
  save(); vnSelId = null; vnRender();
}
function vnEditText(id){
  const it = db.vision.items[id], d = $('vnDlg'), ta = $('vnDlgTa');
  $('vnDlgT').textContent = it.t === 'photo' ? '사진 밑에 쓸 글' : it.t === 'note' ? '메모' : '글씨';
  ta.value = it.text || '';
  ta.placeholder = it.t === 'txt' ? '예) 2027 나는 이런 사람이 된다' : '';
  d.onclose = () => {
    if(d.returnValue !== 'ok') return;
    vnEdit(id).text = ta.value.trim(); vnRepaint(id); vnLayout();
  };
  d.returnValue = ''; d.showModal(); ta.focus();
}

// 사진 Dropbox 동기화: 이 기기에만 있는 건 올리고, 없는 건 받아 온다
const vnImgPath = id => `/img/${id}.enc`;
async function vnSyncImgs(){
  const up = new Set(sync.imgUp || []);
  let got = false;
  for(const it of Object.values(db.vision.items)){
    if(it.del || !it.img) continue;
    const blob = await imgGet(it.img);
    if(blob && !up.has(it.img)){
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await loadKey(), await blob.arrayBuffer()));
      const body = new Uint8Array(12 + ct.length); body.set(iv); body.set(ct, 12);
      await dbx('https://content.dropboxapi.com/2/files/upload', { headers:{ 'Dropbox-API-Arg': JSON.stringify({ path: vnImgPath(it.img), mode:'overwrite', mute:true }), 'Content-Type':'application/octet-stream' }, body });
      up.add(it.img); sync.imgUp = [...up]; saveSync();
    } else if(!blob){
      let buf;
      try { buf = new Uint8Array(await (await dbx('https://content.dropboxapi.com/2/files/download', { headers:{ 'Dropbox-API-Arg': JSON.stringify({ path: vnImgPath(it.img) }) } })).arrayBuffer()); }
      catch(e) { if(e.dbx?.startsWith('path/not_found')) continue; throw e; }
      const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: buf.slice(0, 12) }, await loadKey(), buf.slice(12));
      await imgPut(it.img, new Blob([pt], { type:'image/jpeg' }));
      up.add(it.img); sync.imgUp = [...up]; saveSync(); got = true;
    }
  }
  if(got && vnOpen) vnRender();
}

$('vnFile').onchange = e => { vnAddPhotos([...e.target.files]); e.target.value = ''; };
// 비전보드에서 붙여넣기: 사진이면 사진, 글이면 메모로
document.addEventListener('paste', e => {
  if(!vnOpen || $('vnDlg').open) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); vnAddPhotos(files); return; }
  const t = e.clipboardData?.getData('text')?.trim();
  if(t){ e.preventDefault(); vnAdd('note', { text: t }); }
});
document.addEventListener('keydown', e => {
  if(!vnOpen || $('vnDlg').open || !vnSelId || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); vnDelete(vnSelId); }
  else if(e.key === 'Escape') vnSelect(null);
});

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
document.fonts?.ready.then(calibrate);

render();
// 동기화: 열 때, 다시 화면에 돌아올 때, 인터넷이 다시 될 때, 앱을 떠날 때(고친 게 있으면)
if(CAN_SYNC){
  if(sync.key && sync.last){ const t = new Date(sync.last); setSync(`☁ ${pad(t.getHours())}:${pad(t.getMinutes())}`); }
  handleRedirect().finally(() => doSync());
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' || sync.dirty) doSync(); });
  addEventListener('online', () => doSync());
}
